name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm pack:dry-run

  site-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter svedocs build
      - run: pnpm --filter @svedocs/site check
      - run: pnpm --filter @svedocs/site lint
      - run: SVEDOCS_BUILD_MODE=static pnpm --filter @svedocs/site build
      - run: SVEDOCS_BUILD_MODE=spa pnpm --filter @svedocs/site build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @svedocs/site test:e2e
      - name: Verify content hot reload
        run: SVEDOCS_E2E_HMR=1 pnpm --filter @svedocs/site test:e2e e2e/hmr.spec.ts --workers=1
      - name: Verify optional integrations
        run: SVEDOCS_E2E_INTEGRATIONS=1 pnpm --filter @svedocs/site test:e2e e2e/integrations.spec.ts
      - name: Build composed theme and SEO fixtures
        run: SVEDOCS_E2E_BORDERS=1 SVEDOCS_E2E_SEO=1 pnpm --filter @svedocs/site build
      - name: Verify theme frames and custom SEO in production
        run: SVEDOCS_E2E_BORDERS=1 SVEDOCS_E2E_SEO=1 SVEDOCS_E2E_PREVIEW=1 pnpm --filter @svedocs/site test:e2e e2e/borders.spec.ts e2e/seo-renderer.spec.ts

  template-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter svedocs-cli... build
      - run: pnpm test:templates
