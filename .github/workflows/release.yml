name: Release npm packages

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-npm-packages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Resolve release channel
        id: release-channel
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          case "$RELEASE_CHANNEL" in
            stable)
              echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
              ;;
            beta)
              echo "npm_tag=beta" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported release channel: $RELEASE_CHANNEL" >&2
              exit 1
              ;;
          esac
      - name: Validate package versions
        id: release-version
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const { readFileSync } = require('node:fs');

          const packageFiles = [
            'packages/svedocs/package.json',
            'packages/cli/package.json',
            'packages/create-svedocs/package.json'
          ];
          const packages = packageFiles.map((file) => {
            const manifest = JSON.parse(readFileSync(file, 'utf8'));
            return { file, name: manifest.name, version: manifest.version };
          });
          const versions = new Set(packages.map((pkg) => pkg.version));
          if (versions.size !== 1) {
            console.error('Release packages must share the same version.');
            for (const pkg of packages) {
              console.error(`- ${pkg.name}@${pkg.version} (${pkg.file})`);
            }
            process.exit(1);
          }

          const version = packages[0].version;
          const semver = version.match(/^\d+\.\d+\.\d+(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/);
          if (!semver) {
            console.error(`Release packages must use a valid semver version, got ${version}.`);
            process.exit(1);
          }

          const prerelease = semver[1];
          const prereleaseParts = prerelease?.split(/[.-]/) ?? [];
          const channel = process.env.RELEASE_CHANNEL;

          if (channel === 'stable' && prerelease) {
            console.error(`Stable releases must use a final semver version, got ${version}.`);
            process.exit(1);
          }
          if (channel === 'beta' && !prereleaseParts.includes('beta')) {
            console.error(`Beta releases must use a beta prerelease version such as 0.1.0-beta.1, got ${version}.`);
            process.exit(1);
          }

          console.log(`Publishing ${packages.map((pkg) => pkg.name).join(', ')} at ${version} on ${channel}.`);
          NODE

          version="$(node -p "require('./packages/svedocs/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - run: pnpm release:check
      - run: pnpm test:templates
      - run: mkdir -p artifacts
      - run: pnpm pack --out ../../artifacts/svedocs.tgz
        working-directory: packages/svedocs
      - run: pnpm pack --out ../../artifacts/svedocs-cli.tgz
        working-directory: packages/cli
      - run: pnpm pack --out ../../artifacts/create-svedocs.tgz
        working-directory: packages/create-svedocs
      - name: Publish npm packages
        env:
          NPM_TAG: ${{ steps.release-channel.outputs.npm_tag }}
        run: |
          set -euo pipefail

          publish_package() {
            local name="$1"
            local version="$2"
            local tarball="$3"

            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version}; it is already published."
              npm dist-tag add "${name}@${version}" "$NPM_TAG"
              return
            fi

            npm publish "$tarball" --access public --provenance --tag "$NPM_TAG"
          }

          publish_package "svedocs" "$(node -p "require('./packages/svedocs/package.json').version")" "./artifacts/svedocs.tgz"
          publish_package "svedocs-cli" "$(node -p "require('./packages/cli/package.json').version")" "./artifacts/svedocs-cli.tgz"
          publish_package "create-svedocs" "$(node -p "require('./packages/create-svedocs/package.json').version")" "./artifacts/create-svedocs.tgz"
      - name: Generate GitHub Release notes
        if: inputs.channel == 'stable'
        id: release-notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/release-notes.md"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            --raw-field "tag_name=$RELEASE_TAG" \
            --raw-field "target_commitish=$GITHUB_SHA" \
            --jq '.body' > "$notes_file"

          if ! grep -Eq '^## ' "$notes_file"; then
            previous_tag="$({
              git tag --list 'v[0-9]*' --sort=-v:refname |
                grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
                grep -Fxv "$RELEASE_TAG" |
                head -n 1
            } || true)"
            range="$GITHUB_SHA"
            if [[ -n "$previous_tag" ]]; then
              range="$previous_tag..$GITHUB_SHA"
            fi

            {
              echo
              echo '## Changes'
              echo
              git log --first-parent --no-merges --pretty=format:'- %s (`%h`)' "$range"
              echo
            } >> "$notes_file"
          fi

          echo "path=$notes_file" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        if: inputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: ${{ steps.release-notes.outputs.path }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          set -euo pipefail

          assets=(
            ./artifacts/svedocs.tgz
            ./artifacts/svedocs-cli.tgz
            ./artifacts/create-svedocs.tgz
          )

          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG points to $tag_commit, not the release commit $GITHUB_SHA." >&2
              exit 1
            fi
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "svedocs $RELEASE_VERSION" \
              --notes-file "$RELEASE_NOTES_FILE" \
              --latest
            exit 0
          fi

          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for asset in "${assets[@]}"; do
            asset_name="$(basename "$asset")"
            if grep -Fxq "$asset_name" <<< "$existing_assets"; then
              echo "Skipping $asset_name; it is already attached to $RELEASE_TAG."
              continue
            fi
            gh release upload "$RELEASE_TAG" "$asset"
          done
